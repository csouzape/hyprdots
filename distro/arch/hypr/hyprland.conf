#╔════════════════════════════╗
#║      GLOBAL VARIABLES      ║
#╚════════════════════════════╝

$mainMod = SUPER 
$terminal = alacritty
$fileManager = thunar
$menu = rofi -show drun
$mic = @DEFAULT_SOURCE@


#╔════════════════════════════╗
#║         MONITORS           ║
#╚════════════════════════════╝

monitor = eDP-1,1920x1080,auto,1.25
monitor = HDMI-A-1,1920x1080,auto,1.0
workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:eDP-1

#╔════════════════════════════╗
#║         ENVIRONMENT        ║
#╚════════════════════════════╝

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


#╔════════════════════════════╗
#║         AUTOSTART          ║
#╚════════════════════════════╝

exec-once = dbus-update-activation-environment --systemd --all
exec-once = mkdir -p ~/.cache/awww
exec-once = awww-daemon
exec-once = sleep 1 && awww img "$(find ~/Imagens/Backgrounds -type f | shuf -n 1)"
exec-once = swaync
exec-once = flatpak run com.github.zocker_160.SyncThingy
#╔════════════════════════════╗
#║       PERMISSIONS         ║
#╚════════════════════════════╝

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#╔════════════════════════════╗
#║         GENERAL           ║
#╚════════════════════════════╝

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0

    resize_on_border = false
    allow_tearing = true

    layout = dwindle
}

#╔════════════════════════════╗
#║       DECORATION          ║
#╚════════════════════════════╝
decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

#╔════════════════════════════╗
#║       ANIMATIONS          ║
#╚════════════════════════════╝

animations {
    enabled = yes
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    animation = global,        1, 10, default
    animation = border,        1, 5.39, easeOutQuint
    animation = windows,       1, 2, easeOutQuint
    animation = windowsIn,     1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.49, linear, popin 87%
    animation = fadeIn,        1, 1.73, almostLinear
    animation = fadeOut,       1, 1.46, almostLinear
    animation = fade,          1, 2, quick
    animation = layers,        1, 3, easeOutQuint
    animation = layersIn,      1, 4, easeOutQuint, fade
    animation = layersOut,     1, 1.5, linear, fade
    animation = fadeLayersIn,  1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces,    1, 1.0, almostLinear, fade
    animation = workspacesIn,  1, 1.0, almostLinear, fade
    animation = workspacesOut, 1, 1.0, almostLinear, fade
    animation = zoomFactor,    1, 7, quick
}


#╔════════════════════════════╗
#║        LAYOUTS            ║
#╚════════════════════════════╝

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

#╔════════════════════════════╗
#║         MISC              ║
#╚════════════════════════════╝

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    focus_on_activate = true
    vfr = true
}


#╔════════════════════════════╗
#║         INPUT             ║
#╚════════════════════════════╝

input {
    kb_layout = br
    kb_variant = abnt2
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


#╔════════════════════════════╗
#║      KEYBINDINGS          ║
#╚════════════════════════════╝
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, B, exec, xdg-open https://
bind = ALT, C, exec, brave --new-window --app https://chatgpt.com
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, W, exec, waypaper
bind = $mainMod SHIFT, W, exec, awww img "$(find /home/carlos/Imagens/Backgrounds -type f | shuf -n 1)" --transition-type any
bind = $mainMod, N, exec, swaync-client -t
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, R, exec, killall waybar && waybar
bind = , Print, exec, hyprshot -m region -o ~/Imagens/Capturas\ de\ tela/
bind = SHIFT, Print, exec, hyprshot -m output -o ~/Imagens/Capturas\ de\ tela/
bind = , KP_Prior, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
bind = , KP_Multiply, exec, playerctl next
bind = , KP_Divide, exec, playerctl previous
bind = , KP_Up, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , KP_Home, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , KP_Add, exec, playerctl -p spotify play-pause
bind = , KP_Decimal, exec, playerctl -p spotify volume 0.05+
bind = , KP_Enter, exec, playerctl -p spotify volume 0.05-


bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

binde = SUPER, L, resizeactive, 30 0
binde = SUPER, H, resizeactive, -30 0

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10


#╔════════════════════════════╗
#║       XWAYLAND            ║
#╚════════════════════════════╝

xwayland {
  force_zero_scaling = true
}