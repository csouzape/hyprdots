; Config minimalista - baseado no default.conf do SilentSDDM
; https://github.com/uiriansan/SilentSDDM/wiki/Customizing

[General]
scale = 1.0
enable-animations = false
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = false

[LoginScreen]
background = "wallhaven-jxz98q.jpg"
use-background-color = true
background-color = "#0e0e12"
blur = 0
brightness = 0.0
saturation = 0.0

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
active-size = 0
inactive-size = 0
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "RedHatDisplay"
font-size = 15
font-weight = 600
color = "#E5E5E5"
margin = 12

[LoginScreen.LoginArea.PasswordInput]
width = 220
height = 32
display-icon = false
font-family = "RedHatDisplay"
font-size = 12
content-color = "#E5E5E5"
background-color = "#FFFFFF"
background-opacity = 0.06
border-size = 1
border-color = "#333333"
border-radius-left = 6
border-radius-right = 6
margin-top = 12
masked-character = "•"

[LoginScreen.LoginArea.LoginButton]
background-color = "#FFFFFF"
background-opacity = 0.06
active-background-color = "#FFFFFF"
active-background-opacity = 0.15
icon-size = 16
content-color = "#E5E5E5"
border-size = 1
border-color = "#333333"
border-radius-left = 6
border-radius-right = 6
margin-left = 6
show-text-if-no-password = true
font-family = "RedHatDisplay"
font-size = 12
font-weight = 500

[LoginScreen.LoginArea.WarningMessage]
font-family = "RedHatDisplay"
font-size = 11
normal-color = "#999999"
warning-color = "#E5C07B"
error-color = "#E06C75"
margin-top = 10

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
display-session-name = true
background-opacity = 0.0
active-background-opacity = 0.15
content-color = "#888888"
active-content-color = "#E5E5E5"
border-size = 0
font-size = 10

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
background-opacity = 0.0
active-background-opacity = 0.15
content-color = "#888888"
active-content-color = "#E5E5E5"
border-size = 0
icon-size = 15

[LoginScreen.MenuArea.Layout]
display = false

[LoginScreen.MenuArea.Keyboard]
display = false

[Tooltips]
enable = false
